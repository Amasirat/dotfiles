[mgr]
prepend_keymap = [
    {on = "<C-a>", run = "toggle_all", desc = "Toggle all directories" },
    {on = "y", run = "yank", desc = "yank selected files"},
    {on = "p", run = "paste", desc = "paste yanked files"},
    {on = "d", run = "remove", desc = "Put selected files into trash" },
    {on = "<C-h>", run = "hidden toggle", desc = "toggle visibility of hidden files"},
    {on = "m", run = "plugin mount", desc = "Open Mount Manager"},
]
